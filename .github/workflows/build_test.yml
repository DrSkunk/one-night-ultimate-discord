name: Build and Test

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Typecheck
        run: bun run typecheck
      - name: Test
        run: bun test
      - name: Audit dependencies
        run: bun audit
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          expected="v$(bun -p 'require("./package.json").version')"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "Tag $GITHUB_REF_NAME must match package.json version $expected." >&2
            exit 1
          fi

  executables:
    name: Build ${{ matrix.name }}
    needs: build_and_test
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-latest
            target: bun-windows-x64
            file: WereCord-windows-x64.exe
          - name: macOS Apple Silicon
            runner: macos-15
            target: bun-darwin-arm64
            file: WereCord-macos-arm64
          - name: macOS Intel
            runner: macos-15-intel
            target: bun-darwin-x64
            file: WereCord-macos-x64
          - name: Linux x64
            runner: ubuntu-24.04
            target: bun-linux-x64
            file: WereCord-linux-x64
          - name: Linux ARM64
            runner: ubuntu-24.04-arm
            target: bun-linux-arm64
            file: WereCord-linux-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build standalone executable
        run: >-
          bun build --compile --external=ffmpeg-static
          --no-compile-autoload-dotenv --no-compile-autoload-bunfig
          --target=${{ matrix.target }} src/index.ts
          --outfile=dist/${{ matrix.file }}
      - name: Check executable without source or dependencies
        shell: bash
        run: |
          set -eu
          mkdir "$RUNNER_TEMP/standalone"
          cp "dist/${{ matrix.file }}" "$RUNNER_TEMP/standalone/${{ matrix.file }}"
          cd "$RUNNER_TEMP/standalone"
          unset DISCORD_TOKEN DISCORD_CLIENT_ID DEV_GUILD_ID
          "./${{ matrix.file }}" --check
          "./${{ matrix.file }}" --help
          if "./${{ matrix.file }}" --invalid > invalid.log 2>&1; then
            echo "An invalid option unexpectedly succeeded." >&2
            exit 1
          fi
          grep -q 'Unknown option' invalid.log
          printf 'DISCORD_TOKEN=placeholder\nDISCORD_CLIENT_ID=invalid\n' > .env
          if "./${{ matrix.file }}" --register > config.log 2>&1; then
            echo "Invalid configuration unexpectedly succeeded." >&2
            exit 1
          fi
          grep -q 'DISCORD_CLIENT_ID' config.log
          if grep -q 'DISCORD_TOKEN:' config.log; then
            echo "The executable did not load the working-directory .env." >&2
            exit 1
          fi
      - name: Include licenses and example configuration
        shell: bash
        run: |
          set -eu
          bun scripts/collect-licenses.ts > dist/THIRD_PARTY_LICENSES.txt
          cp LICENSE dist/LICENSE
          cp README.md dist/README.md
          cp .env.example dist/config.example
          curl --fail --silent --show-error --location \
            "https://raw.githubusercontent.com/oven-sh/bun/bun-v$(bun --version)/LICENSE.md" \
            --output dist/BUN_LICENSE.md
      - name: Upload executable
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: executable-${{ matrix.file }}
          path: |
            dist/${{ matrix.file }}
            dist/LICENSE
            dist/README.md
            dist/THIRD_PARTY_LICENSES.txt
            dist/BUN_LICENSE.md
            dist/config.example
          if-no-files-found: error
          retention-days: 7

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build_and_test, executables]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download executables
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: executable-*
          path: release-artifacts
      - name: Package releases and create checksums
        shell: bash
        run: |
          set -eu
          shopt -s nullglob
          artifacts=(release-artifacts/executable-*)
          if [ "${#artifacts[@]}" -ne 5 ]; then
            echo "Expected five executable artifacts." >&2
            exit 1
          fi
          mkdir release
          for artifact in "${artifacts[@]}"; do
            binaries=("$artifact"/WereCord-*)
            if [ "${#binaries[@]}" -ne 1 ] || [ ! -f "${binaries[0]}" ]; then
              echo "Expected one executable in $artifact." >&2
              exit 1
            fi
            binary="$(basename "${binaries[0]}")"
            archive="${binary%.exe}.zip"
            # Artifact transfer drops Unix permissions; restore them before zipping.
            chmod 755 "$artifact/$binary"
            (
              cd "$artifact"
              zip -q "$GITHUB_WORKSPACE/release/$archive" "$binary" \
                LICENSE README.md THIRD_PARTY_LICENSES.txt BUN_LICENSE.md config.example
            )
            unzip -tq "release/$archive"
            if [[ "$binary" != *.exe ]]; then
              zipinfo "release/$archive" "$binary" | grep -q '^-rwx' || {
                echo "$binary is not executable in $archive." >&2
                exit 1
              }
            fi
          done
          (cd release && sha256sum WereCord-*.zip > SHA256SUMS.txt)
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          args=(--verify-tag --generate-notes)
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            args+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" \
            release/WereCord-*.zip release/SHA256SUMS.txt "${args[@]}"
